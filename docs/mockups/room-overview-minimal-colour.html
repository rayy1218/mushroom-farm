<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room card: minimal and in colour</title>
<style>
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1113; --surface: #1c1f22; --surface-2: #24282c; --ink: #f1f3f4; --muted: #959ba2; --ink-2: #c3c8cd;
  --border: rgba(255,255,255,.1); --border-strong: rgba(255,255,255,.24);
  --good-text: #0ca30c; --warning-text: #fab219;
  --run: #2fd0b5; --run-soft: rgba(47,208,181,.16); --track: #2c3135; --bandfill: rgba(47,208,181,.28);
  /* picture */
  --sky-day-1: #1d3550; --sky-day-2: #172531; --sky-night-1: #070d18; --sky-night-2: #111a27;
  --ground-1: #2b2721; --ground-2: #1a1815;
  --steel-1: #2f6164; --steel-2: #24494c; --steel-edge: #193537;
  --inside-1: #2b3036; --inside-2: #1f2327; --floor: #15181b; --foam: #b9a46c;
  --unit-1: #eef1f4; --unit-2: #c9d0d7; --unit-ink: #3a4148;
  --rack: #8a939c; --bag-1: #d9c8a5; --bag-2: #b8a47c; --shroom-1: #fffaf0; --shroom-2: #e9dcc3;
  --cool: #6ec3ff; --warm: #ff9a5a; --mist: #cfeeff; --label-bg: rgba(15,17,19,.72);
  --flat-sky: #1b2c3d; --flat-night: #0d1522; --flat-ground: #262320; --flat-inside: #262b30; --sun: #f7c95c; --moon: #e6ebf3;
  --ac-accent: #3987e5; --hu-accent: #2b9fd0; --dh-accent: #8b6fe0; --unit-edge: transparent;
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #dde0e3; --surface: #f4f5f6; --surface-2: #e9ebed; --ink: #15181b; --muted: #565c63; --ink-2: #464c53;
  --border: rgba(21,24,27,.13); --border-strong: rgba(21,24,27,.28);
  --good-text: #006300; --warning-text: #7a5200;
  --run: #0f8a76; --run-soft: rgba(15,138,118,.13); --track: #d5d9dd; --bandfill: rgba(15,138,118,.25);
  --sky-day-1: #9fd0f0; --sky-day-2: #e3f1fa; --sky-night-1: #26324a; --sky-night-2: #46556f;
  --ground-1: #cbbfa9; --ground-2: #b3a68f;
  --steel-1: #4f8a8c; --steel-2: #3f7476; --steel-edge: #2c5558;
  --inside-1: #f3f5f7; --inside-2: #e3e7eb; --floor: #c9cfd5; --foam: #d8c58e;
  --unit-1: #ffffff; --unit-2: #dfe4e9; --unit-ink: #3a4148;
  --rack: #6f7983; --bag-1: #e3d3b0; --bag-2: #c2ae86; --shroom-1: #ffffff; --shroom-2: #ece0c8;
  --cool: #2f8fe0; --warm: #f07a32; --mist: #8ccff5; --label-bg: rgba(255,255,255,.8);
  --flat-sky: #d6ebf7; --flat-night: #3a4863; --flat-ground: #d3c8b5; --flat-inside: #f2f4f6; --sun: #f2b632; --moon: #f3f5f9;
  --ac-accent: #2a78d6; --hu-accent: #1f8fc0; --dh-accent: #6b4fc0; --unit-edge: #b9c1c9;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--page); }
header.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
header.bar h1 { font-size: 16px; margin: 0 10px 0 0; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; color: var(--ink-2); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
main { padding: 20px; display: grid; justify-items: center; }
.frame { width: 100%; max-width: 1180px; }
.frame.phone { max-width: 400px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px 18px; }
.card > h2 { margin: 0 0 12px; font-size: 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card > h2 small { font-size: 12px; font-weight: 500; color: var(--muted); }
.muted { color: var(--muted); }

.top { display: grid; grid-template-columns: minmax(0, 2fr) minmax(230px, 1fr); gap: 14px; align-items: stretch; }
.pic { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--flat-ground); } /* taller than the picture: the ground goes on */
.pic svg { display: block; width: 100%; height: auto; }
.side { display: grid; gap: 8px; align-content: start; }

/* reading tiles (E) */
.tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 6px; }
.tile.warn { border-color: var(--warning-text); }
.tile .lab { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.tile .val { font-size: 30px; font-weight: 650; letter-spacing: -.5px; line-height: 1.1; margin-top: 2px; }
.tile .val small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.status { font-size: 12px; font-weight: 600; }
.status.good { color: var(--good-text); } .status.warn { color: var(--warning-text); }
.bandbar { position: relative; height: 22px; margin: 6px 0 14px; }
.bandbar .track { position: absolute; left: 0; right: 0; top: 8px; height: 6px; border-radius: 3px; background: var(--track); }
.bandbar .zone { position: absolute; top: 5px; height: 12px; border-radius: 3px; background: var(--bandfill); }
.bandbar .mark { position: absolute; top: 1px; width: 4px; height: 20px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface-2); transition: left .6s; }
.bandbar .lim { position: absolute; top: 22px; font-size: 11px; color: var(--muted); transform: translateX(-50%); }

/* machine tiles (B) in air-path order with their effect (C) */
.mhead { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 8px; gap: 10px; flex-wrap: wrap; }
.mhead b { font-size: 13px; }
.mhead span { font-size: 12px; color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.mtile { position: relative; display: grid; gap: 3px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.mtile.on { border-color: var(--run); box-shadow: inset 0 0 0 1px var(--run-soft); }
.mtile .n { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-weight: 600; font-size: 13px; }
.mtile .d { font-size: 12px; color: var(--muted); }
.mtile .eff { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.mtile.on .eff { color: var(--run); }
.mtile .step { position: absolute; top: -9px; left: 10px; font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--border-strong); color: var(--muted); white-space: nowrap; }
.pill.on { color: var(--run); border-color: var(--run); background: var(--run-soft); }
.pill.on::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--run); }
.strip { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.strip b { color: var(--ink); }

/* picture */
svg text { font-family: inherit; }
/* white machine units: a thin edge in the light theme, where the room is white too */
svg rect[fill="var(--unit-1)"] { stroke: var(--unit-edge); stroke-width: 1; }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
.spin.slow { animation-duration: 3s; }
@keyframes spin { to { transform: rotate(360deg); } }
.stream { stroke-dasharray: 3 11; animation: stream 1.1s linear infinite; }
@keyframes stream { to { stroke-dashoffset: -28; } }
.plume { stroke-dasharray: 10 14; animation: stream 2.2s linear infinite; }
.mist circle { animation: mist 3s ease-out infinite; transform-box: fill-box; }
@keyframes mist { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-70px) scale(1.8); opacity: 0; } }
.drip { animation: drip 1.6s ease-in infinite; }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
.glow { animation: glow 2s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .35; } to { opacity: .9; } }
.twinkle { animation: glow 2.5s ease-in-out infinite alternate; }
@media (prefers-reduced-motion: reduce) { .spin, .stream, .plume, .mist circle, .drip, .glow, .twinkle { animation: none; } }

/* phone */
.phone .top { grid-template-columns: 1fr; }
.phone .side { order: -1; }
.phone .tags { display: none; } /* too small there; the machine tiles say it */
.phone .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .mgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
</style>
</head>
<body>
<header class="bar">
  <h1>Room card: minimal + colour</h1>
  <div class="seg" role="group" aria-label="Scenario">
    <button data-s="now" aria-pressed="true">Now</button><button data-s="fresh" aria-pressed="false">Fresh air</button><button data-s="night" aria-pressed="false">Night</button>
  </div>
  <div class="seg" role="group" aria-label="Width">
    <button data-w="desk" aria-pressed="true">Desktop</button><button data-w="phone" aria-pressed="false">Phone</button>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button data-t="dark" aria-pressed="true">Dark</button><button data-t="light" aria-pressed="false">Light</button>
  </div>
</header>
<main><div class="frame" id="frame"></div></main>

<script>
// Three moments of the same room: as in the screenshot, during a fresh-air exchange, and at night.
const BASE = {
  t: { name: 'Temperature', v: 21.5, unit: '°C', lo: 21, hi: 23, min: 15, max: 30, dec: 1 },
  rh: { name: 'Humidity', v: 92, unit: '% RH', lo: 90, hi: 95, min: 70, max: 100, dec: 0 },
  co2: { name: 'CO₂', v: 500, unit: 'ppm', lo: 600, hi: 900, min: 400, max: 1500, dec: 0 },
};
const SCENES = {
  now: { night: false, outdoor: { t: 32.9, rh: 62 }, reads: { t: 21.5, rh: 92, co2: 500 }, on: { ac: true, circulation: true }, next: 'Next fresh air in 8 min' },
  fresh: { night: false, outdoor: { t: 32.9, rh: 62 }, reads: { t: 22.4, rh: 88, co2: 960 }, on: { ac: true, circulation: true, intake: true, exhaust: true, humidifier: true }, next: 'Fresh air for 3 min · CO₂ above 900' },
  night: { night: true, outdoor: { t: 25.4, rh: 91 }, reads: { t: 21.8, rh: 93, co2: 640 }, on: { ac: true, circulation: true }, next: 'Next fresh air in 11 min' },
};
const MACHINES = [
  { key: 'intake', name: 'Intake fan', eff: 'Air in', d: (s) => (s.on.intake ? 'Filter 40 Pa' : 'Filter 40 Pa · waits') },
  { key: 'ac', name: 'Aircon', eff: '− Temperature', d: () => 'Cool to 21.5 °C · fan auto' },
  { key: 'circulation', name: 'Circulation', eff: 'Mixes the air', d: () => 'Always on' },
  { key: 'humidifier', name: 'Humidifier', eff: '+ Humidity', d: (s) => (s.on.humidifier ? 'On with the fresh air' : 'Below 90 %') },
  { key: 'dehumidifier', name: 'Dehumidifier', eff: '− Humidity', d: () => 'Above 95 %' },
  { key: 'exhaust', name: 'Exhaust fan', eff: 'Air out', d: (s) => (s.on.exhaust ? 'With the intake' : 'With the intake') },
];
let scene = 'now';

const st = (r) => (r.v < r.lo ? { cls: 'warn', text: '▼ Below band' } : r.v > r.hi ? { cls: 'warn', text: '▲ Above band' } : { cls: 'good', text: '✓ In band' });
const pct = (r, x) => Math.max(0, Math.min(100, ((x - r.min) / (r.max - r.min)) * 100));
const fmt = (r) => r.v.toFixed(r.dec);
const pill = (on) => `<span class="pill ${on ? 'on' : ''}">${on ? 'On' : 'Off'}</span>`;

// ---------- the picture: flat and minimal, in colour ----------
// Flat shapes and one colour per thing (no gradients, shadows or hatching); each machine's name and state sit right beside it.
// The blades turn about the hub (12, 12) itself: a CSS rotation about the blades' outline box put them off centre.
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fan(cx, cy, r, on, slow = false) {
  const blades = [0, 120, 240].map((a) => `<path transform="rotate(${a} 12 12)" d="M12 12 C9.5 9 9.6 4.2 12.6 3.4 C15.6 3.3 15.4 8.4 12 12 Z"/>`).join('');
  return `<g transform="translate(${cx - r},${cy - r}) scale(${(2 * r) / 24})">
    <circle cx="12" cy="12" r="11" fill="var(--unit-1)" stroke="${on ? 'var(--run)' : 'var(--unit-2)'}" stroke-width="1.6"/>
    <g fill="${on ? 'var(--run)' : 'var(--unit-ink)'}">${blades}<circle cx="12" cy="12" r="1.9"/>${on && !STILL ? `<animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="${slow ? 3 : 1.4}s" repeatCount="indefinite"/>` : ''}</g>
  </g>`;
}
function rack(x, y) {
  let g = '';
  for (let s = 0; s < 3; s++) {
    const shelf = y + 40 + s * 44;
    for (let b = 0; b < 5; b++) {
      const bx = x + 6 + b * 23;
      g += `<rect x="${bx}" y="${shelf - 31}" width="19" height="30" rx="7" fill="var(--bag-1)"/>`;
      g += `<circle cx="${bx + 9.5}" cy="${shelf - 13}" r="6" fill="var(--shroom-1)"/>`;
    }
    g += `<rect x="${x}" y="${shelf}" width="122" height="3" rx="1.5" fill="var(--rack)"/>`;
  }
  return `${g}<rect x="${x}" y="${y}" width="3" height="134" rx="1.5" fill="var(--rack)"/><rect x="${x + 119}" y="${y}" width="3" height="134" rx="1.5" fill="var(--rack)"/>`;
}
// A machine's name and state: two short lines, placed next to it.
function tag(x, y, name, on, anchor = 'middle', sub = '') {
  return `<g class="tags"><text x="${x}" y="${y}" text-anchor="${anchor}" font-size="12.5" font-weight="650" fill="var(--ink)">${name}</text>
    <text x="${x}" y="${y + 15}" text-anchor="${anchor}" font-size="11.5" font-weight="600" fill="${on ? 'var(--run)' : 'var(--muted)'}">${on ? '● On' : 'Off'}${sub ? `<tspan fill="var(--muted)" font-weight="400"> · ${sub}</tspan>` : ''}</text></g>`;
}
function picture(s) {
  const on = (k) => Boolean(s.on[k]);
  const exch = on('intake') && on('exhaust');
  const mist = on('humidifier') ? `<g class="mist">${[0, 1, 2, 3, 4, 5].map((i) => `<circle cx="${542 + (i % 3) * 6}" cy="262" r="4" fill="var(--mist)" style="animation-delay:${i * 0.5}s"/>`).join('')}</g>` : '';
  return `<svg viewBox="0 0 840 380" role="img" aria-label="Room picture: ${MACHINES.filter((m) => on(m.key)).map((m) => m.name).join(', ') || 'nothing'} running">
  <!-- sky and ground, flat -->
  <rect width="840" height="336" fill="var(${s.night ? '--flat-night' : '--flat-sky'})"/>
  <rect y="334" width="840" height="46" fill="var(--flat-ground)"/>
  ${s.night ? `<circle cx="46" cy="46" r="13" fill="var(--moon)"/><circle cx="52" cy="41" r="11" fill="var(--flat-night)"/>` : `<circle cx="46" cy="46" r="13" fill="var(--sun)"/>`}
  <text x="70" y="40" font-size="11" font-weight="700" letter-spacing="1.4" fill="var(--muted)">OUTDOOR</text>
  <text x="70" y="59" font-size="18" font-weight="700" fill="var(--ink)">${s.outdoor.t} °C</text>
  <text x="70" y="75" font-size="12" fill="var(--muted)">${s.outdoor.rh} % RH</text>

  <!-- the container: a teal shell, cut open; a few ribs on the roof edge -->
  <rect x="150" y="112" width="540" height="222" rx="6" fill="var(--steel-1)"/>
  <g stroke="var(--steel-2)" stroke-width="3">${Array.from({ length: 26 }, (_, i) => `<line x1="${164 + i * 20}" y1="114" x2="${164 + i * 20}" y2="124"/>`).join('')}</g>
  <rect x="164" y="126" width="512" height="196" rx="2" fill="var(--flat-inside)"/>
  <rect x="164" y="314" width="512" height="8" fill="var(--floor)"/>

  <!-- condenser on the roof, its pipe -->
  <rect x="424" y="104" width="4" height="30" fill="var(--rack)"/>
  <rect x="392" y="70" width="70" height="38" rx="6" fill="var(--unit-1)"/>
  ${fan(412, 89, 14, on('ac'))}
  <g stroke="var(--unit-2)" stroke-width="2" stroke-linecap="round"><line x1="434" y1="80" x2="452" y2="80"/><line x1="434" y1="87" x2="452" y2="87"/><line x1="434" y1="94" x2="452" y2="94"/><line x1="434" y1="101" x2="452" y2="101"/></g>
  ${tag(472, 84, 'Condenser', on('ac'), 'start')}

  <!-- split aircon under the ceiling; cool air while it runs -->
  <rect x="352" y="134" width="150" height="30" rx="8" fill="var(--unit-1)"/>
  <rect x="352" y="134" width="5" height="30" rx="2" fill="var(--ac-accent)"/>
  <text x="366" y="153" font-size="11.5" font-weight="700" fill="var(--unit-ink)">Aircon · cool 21.5 °C</text>
  <circle cx="491" cy="143" r="3" fill="${on('ac') ? 'var(--cool)' : 'var(--unit-2)'}"/>
  ${on('ac') ? [0, 1, 2].map((i) => `<path class="plume" style="animation-delay:${i * 0.5}s" d="M${384 + i * 40} 170 q -6 26 -16 50" stroke="var(--cool)" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/>`).join('') : ''}

  <!-- racks of lion's mane -->
  ${rack(258, 178)}${rack(392, 178)}

  <!-- the air path: in through the filter, over the racks, out the far end -->
  <path d="M112 170 H150 C 250 160, 420 196, 490 214 S 640 262, 714 270 H 770" fill="none"
    stroke="${exch ? 'var(--cool)' : 'var(--muted)'}" stroke-width="${exch ? 2.5 : 1.5}" stroke-linecap="round"
    class="${exch ? 'stream' : ''}" ${exch ? 'marker-end="url(#head2)"' : 'stroke-dasharray="2 7" opacity=".45"'}/>
  <defs><marker id="head2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--cool)"/></marker></defs>

  <!-- intake: hood with its filter, then the fan in the end wall in front of it (the exhaust is drawn the same way); its name to the left -->
  <rect x="118" y="146" width="32" height="50" rx="5" fill="var(--unit-1)"/>
  <g stroke="var(--unit-2)" stroke-width="2" stroke-linecap="round"><line x1="124" y1="156" x2="136" y2="156"/><line x1="124" y1="164" x2="136" y2="164"/><line x1="124" y1="172" x2="136" y2="172"/><line x1="124" y1="180" x2="136" y2="180"/><line x1="124" y1="188" x2="136" y2="188"/></g>
  ${fan(158, 171, 18, on('intake'))}
  ${tag(110, 166, 'Intake fan', on('intake'), 'end', 'filter 40 Pa')}

  <!-- dehumidifier on the near wall; its name outside, level with it -->
  <rect x="174" y="232" width="28" height="44" rx="5" fill="var(--unit-1)"/>
  <rect x="174" y="232" width="28" height="5" rx="2" fill="var(--dh-accent)"/>
  <rect x="180" y="260" width="16" height="9" rx="2" fill="${on('dehumidifier') ? 'var(--cool)' : 'var(--unit-2)'}"/>
  ${on('dehumidifier') ? `<circle class="drip" cx="188" cy="279" r="1.8" fill="var(--cool)"/>` : ''}
  ${tag(172, 292, 'Dehumidifier', on('dehumidifier'), 'start')}

  <!-- circulation fan under the ceiling -->
  <rect x="619" y="126" width="3" height="12" fill="var(--rack)"/>
  ${fan(620, 152, 14, on('circulation'), true)}
  ${tag(620, 186, 'Circulation', on('circulation'))}

  <!-- humidifier on the floor, mist when on -->
  ${mist}
  <rect x="530" y="270" width="36" height="44" rx="8" fill="var(--unit-1)"/>
  <rect x="530" y="270" width="36" height="5" rx="2" fill="var(--hu-accent)"/>
  <path d="M548 284 c-4 6 -5 8 -5 10 a5 5 0 0 0 10 0 c0 -2 -1 -4 -5 -10z" fill="${on('humidifier') ? 'var(--cool)' : 'var(--unit-2)'}"/>
  ${tag(574, 288, 'Humidifier', on('humidifier'), 'start')}

  <!-- exhaust: hood outside, the fan low in the far end wall in front of it; its name under the outgoing air -->
  <rect x="690" y="246" width="30" height="48" rx="5" fill="var(--unit-1)"/>
  <g stroke="var(--unit-2)" stroke-width="2" stroke-linecap="round"><line x1="704" y1="256" x2="714" y2="256"/><line x1="704" y1="264" x2="714" y2="264"/><line x1="704" y1="272" x2="714" y2="272"/><line x1="704" y1="280" x2="714" y2="280"/></g>
  ${fan(683, 270, 18, on('exhaust'))}
  ${tag(728, 298, 'Exhaust fan', on('exhaust'), 'start')}

  <text x="386" y="358" text-anchor="middle" font-size="11.5" fill="var(--muted)">950 lion's mane blocks</text>
</svg>`;
}

function render() {
  const s = SCENES[scene];
  const reads = Object.entries(BASE).map(([k, r]) => ({ ...r, v: s.reads[k] }));
  const tile = (r) => {
    const x = st(r);
    return `<div class="tile ${x.cls === 'warn' ? 'warn' : ''}"><div class="lab"><span>${r.name}</span><span class="status ${x.cls}">${x.text}</span></div>
      <div class="val">${fmt(r)}<small>${r.unit}</small></div>
      <div class="bandbar" role="img" aria-label="${r.name} ${fmt(r)} ${r.unit}, band ${r.lo} to ${r.hi}"><div class="track"></div>
        <div class="zone" style="left:${pct(r, r.lo)}%;width:${pct(r, r.hi) - pct(r, r.lo)}%"></div><div class="mark" style="left:${pct(r, r.v)}%"></div>
        <span class="lim" style="left:${pct(r, r.lo)}%">${r.lo}</span><span class="lim" style="left:${pct(r, r.hi)}%">${r.hi}</span></div></div>`;
  };
  const machine = (m, i) => {
    const on = Boolean(s.on[m.key]);
    return `<div class="mtile ${on ? 'on' : ''}"><span class="step">${i + 1}</span>
      <div class="n"><span>${m.name}</span>${pill(on)}</div><div class="eff">${m.eff}</div><div class="d">${m.d(s)}</div></div>`;
  };
  document.getElementById('frame').innerHTML = `<div class="card">
    <h2>Room <small>Automatic control on · fresh air every 15 min</small></h2>
    <div class="top"><div class="pic">${picture(s)}</div>
      <div class="side">${reads.map(tile).join('')}<div class="strip" style="margin-top:2px"><span>${s.next}</span></div></div></div>
    <div class="mhead"><b>Machines</b><span>in the order the air meets them: in → treated → out</span></div>
    <div class="mgrid">${MACHINES.map(machine).join('')}</div>
    <div class="strip"><span>Outdoor <b>${s.outdoor.t} °C</b> · ${s.outdoor.rh} % RH</span><span>· Filter <b>40 Pa</b>, change by 22 Nov</span></div>
  </div>`;
}

function group(attr, fn) {
  document.querySelectorAll(`[${attr}]`).forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll(`[${attr}]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    fn(b.getAttribute(attr));
  }));
}
group('data-s', (v) => { scene = v; render(); });
group('data-w', (v) => document.getElementById('frame').classList.toggle('phone', v === 'phone'));
group('data-t', (v) => { document.documentElement.dataset.theme = v; });
// ?s=fresh&w=phone&t=light opens a given view (for screenshots).
const q = new URLSearchParams(location.search);
if (q.get('s')) document.querySelector(`[data-s="${q.get('s')}"]`)?.click();
if (q.get('w') === 'phone') document.querySelector('[data-w="phone"]').click();
if (q.get('t') === 'light') document.querySelector('[data-t="light"]').click();
render();
</script>
</body>
</html>

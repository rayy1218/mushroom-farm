<dialog id="room-dialog" aria-labelledby="room-title">
  <form id="room-form">
    <h2 id="room-title">Add room</h2>
    <p class="form-error" id="form-error" role="alert" tabindex="-1" hidden></p>

    <div class="field">
      <label for="f-name">Name</label>
      <input id="f-name" name="name" required maxlength="60" autocomplete="off" aria-describedby="e-name">
      <p class="field-error" aria-live="polite" id="e-name"></p>
    </div>

    <div class="sizes">
      <div class="field">
        <label for="f-length">Length (m)</label>
        <input id="f-length" name="length" type="number" required min="0.5" max="100" step="0.1" inputmode="decimal" aria-describedby="e-length">
        <p class="field-error" aria-live="polite" id="e-length"></p>
      </div>
      <div class="field">
        <label for="f-width">Width (m)</label>
        <input id="f-width" name="width" type="number" required min="0.5" max="100" step="0.1" inputmode="decimal" aria-describedby="e-width">
        <p class="field-error" aria-live="polite" id="e-width"></p>
      </div>
      <div class="field">
        <label for="f-height">Height (m)</label>
        <input id="f-height" name="height" type="number" required min="0.5" max="10" step="0.1" inputmode="decimal" aria-describedby="e-height">
        <p class="field-error" aria-live="polite" id="e-height"></p>
      </div>
    </div>

    <p class="volume" id="volume">Volume: — m³</p>

    <fieldset class="addresses">
      <legend>Sensors (Modbus address)</legend>
      <div class="sizes two">
        <div class="field">
          <label for="f-trhAddress">T/RH probe</label>
          <input id="f-trhAddress" name="trhAddress" type="number" min="1" max="247" step="1" inputmode="numeric" placeholder="none" aria-describedby="e-trhAddress">
          <p class="field-error" aria-live="polite" id="e-trhAddress"></p>
        </div>
        <div class="field">
          <label for="f-co2Address">CO₂ sensor</label>
          <input id="f-co2Address" name="co2Address" type="number" min="1" max="247" step="1" inputmode="numeric" placeholder="none" aria-describedby="e-co2Address">
          <p class="field-error" aria-live="polite" id="e-co2Address"></p>
        </div>
        <div class="field">
          <label for="f-meterAddress">Energy meter address</label>
          <input id="f-meterAddress" name="meterAddress" type="number" min="1" max="247" step="1" inputmode="numeric" placeholder="none" aria-describedby="e-meterAddress">
          <p class="field-error" aria-live="polite" id="e-meterAddress"></p>
        </div>
      </div>
    </fieldset>

    <fieldset class="addresses">
      <legend>Machines (Modbus address)</legend>
      <div class="sizes two">
        <div class="field">
          <label for="f-relayAddress">Relay module</label>
          <input id="f-relayAddress" name="relayAddress" type="number" min="1" max="247" step="1" inputmode="numeric" placeholder="none" aria-describedby="e-relayAddress">
          <p class="field-error" aria-live="polite" id="e-relayAddress"></p>
        </div>
        <div class="field">
          <label for="f-acAddress">Aircon gateway</label>
          <input id="f-acAddress" name="acAddress" type="number" min="1" max="247" step="1" inputmode="numeric" placeholder="none" aria-describedby="e-acAddress">
          <p class="field-error" aria-live="polite" id="e-acAddress"></p>
        </div>
      </div>
    </fieldset>

    <fieldset class="addresses">
      <legend>Power and water (for the usage estimates)</legend>
      <div class="sizes two">
        <div class="field">
          <label for="f-intakeW">Intake fan (W)</label>
          <input id="f-intakeW" name="intakeW" type="number" required min="0" max="5000" step="1" inputmode="decimal" aria-describedby="e-intakeW">
          <p class="field-error" aria-live="polite" id="e-intakeW"></p>
        </div>
        <div class="field">
          <label for="f-exhaustW">Exhaust fan (W)</label>
          <input id="f-exhaustW" name="exhaustW" type="number" required min="0" max="5000" step="1" inputmode="decimal" aria-describedby="e-exhaustW">
          <p class="field-error" aria-live="polite" id="e-exhaustW"></p>
        </div>
        <div class="field">
          <label for="f-circulationW">Circulation fan (W)</label>
          <input id="f-circulationW" name="circulationW" type="number" required min="0" max="5000" step="1" inputmode="decimal" aria-describedby="e-circulationW">
          <p class="field-error" aria-live="polite" id="e-circulationW"></p>
        </div>
        <div class="field">
          <label for="f-humidifierW">Humidifier power (W)</label>
          <input id="f-humidifierW" name="humidifierW" type="number" required min="0" max="5000" step="1" inputmode="decimal" aria-describedby="e-humidifierW">
          <p class="field-error" aria-live="polite" id="e-humidifierW"></p>
        </div>
        <div class="field">
          <label for="f-humidifierLH">Humidifier water (L/h)</label>
          <input id="f-humidifierLH" name="humidifierLH" type="number" required min="0" max="100" step="0.1" inputmode="decimal" aria-describedby="e-humidifierLH">
          <p class="field-error" aria-live="polite" id="e-humidifierLH"></p>
        </div>
        <div class="field">
          <label for="f-acInputW">Aircon rated input (W)</label>
          <input id="f-acInputW" name="acInputW" type="number" required min="0" max="20000" step="1" inputmode="decimal" aria-describedby="e-acInputW">
          <p class="field-error" aria-live="polite" id="e-acInputW"></p>
        </div>
      </div>
    </fieldset>

    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="delete-dialog" aria-labelledby="delete-title">
  <form method="dialog">
    <h2 id="delete-title">Delete room</h2>
    <p id="delete-text"></p>
    <div class="actions">
      <button value="cancel">Cancel</button>
      <button value="delete" class="danger">Delete</button>
    </div>
  </form>
</dialog>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rooms · Mushroom farm</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <h1>Rooms</h1>
    <button type="button" class="primary" id="add">Add room</button>
  </header>

  <main>
    <div class="banner" id="banner" role="alert" hidden>
      <span id="banner-text"></span>
      <button type="button" id="retry" hidden>Retry</button>
    </div>

    <p class="muted" id="loading">Loading rooms…</p>

    <div class="empty" id="empty" hidden>
      <p>No rooms yet</p>
      <button type="button" class="primary" id="add-empty">Add room</button>
    </div>

    <table class="rooms" id="rooms" hidden>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Size (L × W × H m)</th>
          <th scope="col" class="num">Volume (m³)</th>
          <th scope="col">Created</th>
          <th scope="col"><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <dialog id="room-dialog" aria-labelledby="room-title">
    <form id="room-form">
      <h2 id="room-title">Add room</h2>
      <p class="form-error" id="form-error" role="alert" hidden></p>

      <div class="field">
        <label for="f-name">Name</label>
        <input id="f-name" name="name" required maxlength="60" autocomplete="off" aria-describedby="e-name">
        <p class="field-error" id="e-name"></p>
      </div>

      <div class="sizes">
        <div class="field">
          <label for="f-length">Length (m)</label>
          <input id="f-length" name="length" type="number" required min="0.5" max="100" step="0.1" inputmode="decimal" aria-describedby="e-length">
          <p class="field-error" id="e-length"></p>
        </div>
        <div class="field">
          <label for="f-width">Width (m)</label>
          <input id="f-width" name="width" type="number" required min="0.5" max="100" step="0.1" inputmode="decimal" aria-describedby="e-width">
          <p class="field-error" id="e-width"></p>
        </div>
        <div class="field">
          <label for="f-height">Height (m)</label>
          <input id="f-height" name="height" type="number" required min="0.5" max="10" step="0.1" inputmode="decimal" aria-describedby="e-height">
          <p class="field-error" id="e-height"></p>
        </div>
      </div>

      <p class="volume" id="volume">Volume: — m³</p>

      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary" id="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <form method="dialog">
      <h2 id="delete-title">Delete room</h2>
      <p id="delete-text"></p>
      <div class="actions">
        <button value="cancel">Cancel</button>
        <button value="delete" class="danger">Delete</button>
      </div>
    </form>
  </dialog>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Overview · Mushroom farm</title>
  <script>try{var t=localStorage.getItem('farm.theme');document.documentElement.dataset.theme=t==='light'?'light':'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
  <meta name="theme-color" content="#15181c">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mimic.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#view" data-skip>Skip to content</a>
<div class="app">
  <!-- One bar on top (owner, 2026-10-26: no side bar; 2026-10-28: Overview and Settings as links, the alarm count its own
       button, the Rooms list folded into the Overview). -->
  <header class="topbar">
    <a class="brand brand-top" href="#/overview" aria-label="Mushroom farm: Overview"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text"><strong>Mushroom farm</strong><small>Climate and harvest</small></span></a>
    <a class="top-alarm" href="#/overview" data-alarm-button hidden><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg><span class="sr-only">Alarms: </span><span data-badge></span></a>
    <span class="live-mark" data-live="off"><span class="live-dot" aria-hidden="true"></span><span data-live-text>Not live</span></span>
    <button type="button" class="theme-btn" aria-label="Switch colour theme"></button>
    <a class="top-link" href="#/overview" data-nav="overview" aria-label="Overview"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Overview</span></a>
    <a class="top-link" href="#/settings" data-nav="settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Settings</span></a>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<dialog id="room-dialog" aria-labelledby="room-title">
  <form id="room-form" novalidate>
    <h2 id="room-title">Add room</h2>
    <p class="form-error" id="form-error" role="alert" tabindex="-1" hidden></p>
    <!-- Every field, built by room-dialog.js from web/room-fields.js (the same as the room page's two tabs). -->
    <div id="room-fields"></div>
    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="save">Add room</button>
    </div>
  </form>
</dialog>

<dialog id="delete-dialog" aria-labelledby="delete-title">
  <form method="dialog">
    <h2 id="delete-title">Delete room</h2>
    <p id="delete-text"></p>
    <div class="actions">
      <button value="cancel">Cancel</button>
      <button value="delete" class="danger">Delete</button>
    </div>
  </form>
</dialog>

<!-- When the page's modules could not load (the network dropped while loading), say so instead of a blank page (critique 2026-10-28). -->
<div class="load-fail" id="load-fail" role="alert" hidden>
  <p>Couldn't load the farm app. Check the connection to the farm computer.</p>
  <button type="button" class="primary" id="load-fail-reload">Reload</button>
</div>
<script>setTimeout(function(){if(window.farmReady)return;var f=document.getElementById('load-fail');f.hidden=false;document.getElementById('load-fail-reload').addEventListener('click',function(){location.reload();});},8000);</script>
</body>
</html>
